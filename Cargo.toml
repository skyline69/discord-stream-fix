[package]
name = "discord-stream-fix"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A Linux H.264 decoder workaround for Discord"
build = "build.rs"

[lib]
name = "discord_stream_fix"
crate-type = ["cdylib"]

[build-dependencies]
bindgen = "0.73.2"

[dependencies]
bzip2 = "0.6.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
